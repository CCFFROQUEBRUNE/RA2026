<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ROC D'AZUR 2026 — Fiche Vérificateur</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon_192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  /* Thème CLAIR à fort contraste : lisible en plein soleil, sur un vélo ou un quad */
  :root {
    --rouge: #C0392B; --rouge-vif: #E74C3C; --orange: #E67E22;
    --dark: #0D1117; --noir: #000; --blanc: #fff; --gris: #555; --trait: #222;
    --vert: #1E8449; --bleu: #1A5276;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #fff; color: #000; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-size: 18px; min-height: 100vh; }

  /* ── Accueil / choix du jour ── */
  #screenChoix { min-height: 100vh; padding: 22px 16px 30px; max-width: 520px; margin: 0 auto; }
  .logo { font-size: 14px; font-weight: 700; letter-spacing: 3px; color: var(--gris); text-transform: uppercase; }
  .titre { font-size: 40px; font-weight: 900; line-height: 1; margin: 4px 0 2px; }
  .titre span { color: var(--rouge); }
  .sous-titre { font-size: 20px; font-weight: 700; color: var(--bleu); margin-bottom: 18px; }
  .lbl { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gris); margin: 14px 0 6px; }
  .jours { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .jour-btn { padding: 14px 4px; border: 3px solid var(--noir); background: #fff; color: #000; border-radius: 10px;
    font-family: inherit; font-size: 26px; font-weight: 900; cursor: pointer; line-height: 1; }
  .jour-btn small { display: block; font-size: 12px; font-weight: 700; margin-top: 4px; letter-spacing: .5px; }
  .jour-btn.active { background: var(--noir); color: #fff; }
  .carte-fiche { display: block; width: 100%; text-align: left; border: 3px solid var(--noir); border-radius: 12px; background: #fff;
    padding: 14px 16px; margin-top: 10px; cursor: pointer; font-family: inherit; color: #000; }
  .carte-fiche b { display: block; font-size: 28px; font-weight: 900; line-height: 1.05; }
  .carte-fiche span { font-size: 17px; font-weight: 600; color: var(--gris); }
  .vide { margin-top: 18px; padding: 16px; border: 2px dashed var(--gris); border-radius: 12px; font-size: 19px; font-weight: 600; color: var(--gris); text-align: center; }
  .err { margin-top: 14px; color: var(--rouge); font-size: 18px; font-weight: 700; min-height: 22px; }
  .btn { display: inline-block; padding: 12px 18px; border: 3px solid var(--noir); border-radius: 10px; background: #fff; color: #000;
    font-family: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
  .btn.plein { background: var(--noir); color: #fff; }

  /* ── Fiche ── */
  #screenFiche { display: none; padding-bottom: 28px; max-width: 640px; margin: 0 auto; }
  .bandeau { position: sticky; top: 0; z-index: 20; background: var(--noir); color: #fff; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bandeau .t { font-size: 17px; font-weight: 900; letter-spacing: 1px; }
  .bandeau .b { background: #fff; color: #000; border: 0; border-radius: 8px; padding: 7px 12px; font-family: inherit; font-size: 16px; font-weight: 900; cursor: pointer; }
  .entete { padding: 12px 14px; border-bottom: 4px solid var(--noir); }
  .entete .jour { font-size: 16px; font-weight: 700; color: var(--gris); }
  .entete .nom { font-size: 38px; font-weight: 900; line-height: 1.05; }
  .appel { display: block; margin-top: 8px; padding: 12px 14px; background: var(--vert); color: #fff; border-radius: 12px; text-decoration: none; font-size: 30px; font-weight: 900; text-align: center; letter-spacing: 1px; }
  .infos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .info { border: 2px solid var(--noir); border-radius: 10px; padding: 6px 10px; }
  .info small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gris); }
  .info b { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .info.large { grid-column: span 2; }
  .pill { display: inline-block; border: 2px solid var(--noir); border-radius: 8px; padding: 0 8px; margin-right: 6px; font-size: 24px; font-weight: 900; }

  .liste { padding: 6px 10px 0; }
  .ps { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 4px; border-bottom: 2px solid var(--trait); }
  .ps .num { font-size: 52px; font-weight: 900; line-height: 1; min-width: 70px; }
  .ps .num.long { font-size: 30px; min-width: 0; max-width: 150px; }
  .ps .lieu { font-size: 21px; font-weight: 700; line-height: 1.1; }
  .ps .com { grid-column: 2 / span 2; font-size: 20px; font-weight: 600; color: #222; }
  .ps .com::before { content: "➜ "; }
  .ps .droite { text-align: center; }
  .rs { display: inline-block; width: 50px; height: 50px; line-height: 44px; text-align: center; font-size: 36px; font-weight: 900; border: 4px solid var(--noir); border-radius: 8px; }
  .rs.R { background: var(--noir); color: #fff; }
  .rs.S { background: #fff; color: #000; }
  .heure { display: block; font-size: 30px; font-weight: 900; margin-top: 2px; }
  .legende { padding: 10px 14px 0; font-size: 18px; font-weight: 700; }
  .libre { margin: 12px 14px 0; padding: 10px 12px; border: 2px solid var(--noir); border-radius: 10px; font-size: 21px; font-weight: 600; }
  .libre small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gris); }
  .urgence { margin: 14px 14px 0; padding: 12px; background: #FDEDEC; border: 3px solid var(--rouge); border-radius: 12px; font-size: 20px; font-weight: 700; color: #922B21; text-align: center; }
  .maj { margin: 10px 14px 0; font-size: 15px; color: var(--gris); text-align: center; }
  .maj.horsligne { color: var(--rouge); font-weight: 700; }
  #banniere { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999; background: var(--noir); color: #fff; text-align: center; padding: 12px; font-size: 18px; font-weight: 700; }

  /* ── PIN (même module que fiche.html) ── */
  #pin-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--dark); display: flex; align-items: center; justify-content: center; }
  #pin-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 2rem 2.5rem 2.5rem; text-align: center; width: min(360px, 92vw); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  #pin-logo { margin-bottom: .75rem; }
  #pin-titre { font-size: 1.6rem; font-weight: 700; letter-spacing: .08em; color: #fff; margin: 0 0 .25rem; text-transform: uppercase; }
  #pin-sous-titre { font-size: .95rem; color: rgba(255,255,255,.5); margin: 0 0 1.5rem; }
  #pin-dots { display: flex; justify-content: center; gap: .75rem; margin-bottom: .75rem; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: transparent; transition: background .15s, border-color .15s; }
  .dot.active { background: var(--rouge); border-color: var(--rouge-vif); }
  .dot.dot-extra { opacity: 0.25; transform: scale(0.75); transition: opacity .2s, transform .2s, background .15s, border-color .15s; }
  .dot.dot-extra.visible, .dot.dot-extra.active { opacity: 1; transform: scale(1); }
  #pin-erreur { font-size: .9rem; color: #ff6b6b; min-height: 1.2em; margin: 0 0 1rem; }
  #pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .pin-key { font-family: inherit; font-size: 1.4rem; font-weight: 600; padding: .75rem; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; transition: background .12s, transform .08s; user-select: none; }
  .pin-key:active:not(:disabled) { background: rgba(255,255,255,.18); transform: scale(.93); }
  .pin-key:disabled { opacity: .35; cursor: default; }
  .pin-key--efface { font-size: 1.2rem; }
  .pin-key--ok { background: var(--rouge); border-color: var(--rouge-vif); font-size: 1.1rem; letter-spacing: .05em; }
  #pin-chargement { color: rgba(255,255,255,.55); font-size: .9rem; margin-top: .75rem; }
  @keyframes pinShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  .pin-shake { animation: pinShake .4s ease; }
</style>
</head>
<body>

<!-- OVERLAY PIN — même code d'accès que saisie.html / fiche.html -->
<div id="pin-overlay">
  <div id="pin-card">
    <div id="pin-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#C0392B"/>
        <path d="M24 10L36 17V31L24 38L12 31V17L24 10Z" stroke="white" stroke-width="2.5" fill="none"/>
        <circle cx="24" cy="24" r="5" fill="white"/>
      </svg>
    </div>
    <p id="pin-titre">ROC D'AZUR 2026</p>
    <p id="pin-sous-titre">Accès sécurisé — saisissez le code</p>
    <div id="pin-dots">
      <span class="dot" id="d0"></span><span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span>
      <span class="dot dot-extra" id="d4"></span><span class="dot dot-extra" id="d5"></span><span class="dot dot-extra" id="d6"></span><span class="dot dot-extra" id="d7"></span>
    </div>
    <p id="pin-erreur" aria-live="polite"></p>
    <div id="pin-pad">
      <button class="pin-key" data-v="1">1</button><button class="pin-key" data-v="2">2</button><button class="pin-key" data-v="3">3</button>
      <button class="pin-key" data-v="4">4</button><button class="pin-key" data-v="5">5</button><button class="pin-key" data-v="6">6</button>
      <button class="pin-key" data-v="7">7</button><button class="pin-key" data-v="8">8</button><button class="pin-key" data-v="9">9</button>
      <button class="pin-key pin-key--efface" id="pin-efface" title="Effacer">⌫</button>
      <button class="pin-key" data-v="0">0</button>
      <button class="pin-key pin-key--ok" id="pin-valider" title="Valider" disabled>OK</button>
    </div>
    <p id="pin-chargement" hidden>Vérification…</p>
  </div>
</div>

<script>
// ============================================================
// MODULE PIN — RA2026 — verif.html (identique à fiche.html)
// ============================================================
(function () {
  'use strict';
  var AS_URL      = 'https://script.google.com/macros/s/AKfycbxn5wLvHEiVHduurSgdUL51dV6KIn18oOYD40jEEN5EOJdxUA5WRApXkwihnrES9wPP/exec';
  var SESSION_KEY = 'pinOk';
  var saisi       = '';
  var overlay     = document.getElementById('pin-overlay');
  var validerBtn  = document.getElementById('pin-valider');
  var effaceBtn   = document.getElementById('pin-efface');
  var erreurEl    = document.getElementById('pin-erreur');
  var chargEl     = document.getElementById('pin-chargement');
  var padEl       = document.getElementById('pin-pad');
  var dots        = document.querySelectorAll('.dot');

  var dejaOk = false;
  try { dejaOk = sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) {}
  if (dejaOk) { _cacher(); return; }

  padEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.pin-key');
    if (!btn || btn.disabled) return;
    if (btn === effaceBtn)       _effacer();
    else if (btn === validerBtn) _soumettre();
    else                         _ajouter(btn.dataset.v);
  });
  document.addEventListener('keydown', function (e) {
    if (overlay.style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') _ajouter(e.key);
    else if (e.key === 'Backspace')    _effacer();
    else if (e.key === 'Enter')        _soumettre();
  });
  function _ajouter(c) { if (saisi.length < 8) { saisi += c; _maj(); } }
  function _effacer()  { if (saisi.length) { saisi = saisi.slice(0,-1); erreurEl.textContent=''; _maj(); } }
  function _maj() {
    dots.forEach(function(d, i) {
      d.classList.toggle('active', i < saisi.length);
      if (d.classList.contains('dot-extra')) d.classList.toggle('visible', saisi.length > i);
    });
    validerBtn.disabled = saisi.length < 4;
  }
  function _soumettre() {
    if (saisi.length < 4) return;
    _setLoading(true);
    var cbName = 'pinCbV_' + Math.random().toString(36).slice(2);
    var timer  = setTimeout(function(){ delete window[cbName]; _onError('Timeout réseau — réessayez'); }, 90000);
    window[cbName] = function(data) {
      clearTimeout(timer); delete window[cbName]; _setLoading(false);
      if (data.ok) { try { sessionStorage.setItem(SESSION_KEY,'1'); } catch (e) {} _cacher(); window.dispatchEvent(new Event('pin-ok')); }
      else { erreurEl.textContent='Code incorrect. Réessayez.'; _shake(); saisi=''; _maj(); }
    };
    var s = document.createElement('script');
    s.src = AS_URL + '?action=verifyPin&pin=' + encodeURIComponent(saisi) + '&callback=' + cbName;
    s.onerror = function(){ clearTimeout(timer); delete window[cbName]; _onError('Erreur réseau'); };
    document.head.appendChild(s);
    setTimeout(function(){ try{ s.remove(); }catch(e){} }, 95000);
  }
  function _onError(msg){ _setLoading(false); erreurEl.textContent=msg; saisi=''; _maj(); }
  function _cacher()    { if (overlay) overlay.style.display='none'; }
  function _setLoading(on){ chargEl.hidden=!on; padEl.querySelectorAll('.pin-key').forEach(function(b){ b.disabled=on; }); }
  function _shake()     { var c=document.getElementById('pin-card'); c.classList.remove('pin-shake'); void c.offsetWidth; c.classList.add('pin-shake'); }
})();
</script>

<div id="banniere"></div>

<!-- ======= CHOIX DU JOUR / DE LA FICHE ======= -->
<div id="screenChoix">
  <div class="logo">CCFF · RSA</div>
  <div class="titre">ROC D'AZUR <span>2026</span></div>
  <div class="sous-titre">Fiche Vérificateur</div>
  <div class="lbl">Jour</div>
  <div class="jours" id="jours"></div>
  <div id="fiches"></div>
  <div class="err" id="err"></div>
</div>

<!-- ======= FICHE ======= -->
<div id="screenFiche">
  <div class="bandeau">
    <button class="b" onclick="retour()">← Retour</button>
    <span class="t">🚵 VÉRIFICATION</span>
    <button class="b" onclick="actualiser()">↻</button>
  </div>
  <div id="ficheBody"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxn5wLvHEiVHduurSgdUL51dV6KIn18oOYD40jEEN5EOJdxUA5WRApXkwihnrES9wPP/exec';
const JOURS = [
  { id:'J2', label:'J2', court:'Jeu 08/10',  date:'JEUDI 08/10/2026',    iso:'2026-10-08' },
  { id:'J3', label:'J3', court:'Ven 09/10',  date:'VENDREDI 09/10/2026', iso:'2026-10-09' },
  { id:'J4', label:'J4', court:'Sam 10/10',  date:'SAMEDI 10/10/2026',   iso:'2026-10-10' },
  { id:'J5', label:'J5', court:'Dim 11/10',  date:'DIMANCHE 11/10/2026', iso:'2026-10-11' },
];

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── JSONP (même mécanisme que le reste de l'application) ─────────────────────
function callAS(params) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const timer  = setTimeout(() => { delete window[cbName]; reject(new Error('Timeout — connexion trop lente')); }, 60000);
    window[cbName] = data => { clearTimeout(timer); delete window[cbName]; resolve(data); };
    const s = document.createElement('script');
    s.src = APPS_SCRIPT_URL + '?' + new URLSearchParams({ ...params, callback: cbName });
    s.onerror = () => { console.warn('JSONP onerror (redirect 302 probable) — on attend le timeout'); };
    document.head.appendChild(s);
    setTimeout(() => { try { s.remove(); } catch(e){} }, 65000);
  });
}
async function callASRetry(params, maxRetries = 2) {
  for (let a = 1; a <= maxRetries; a++) {
    try { return await callAS(params); } catch(e) { if (a === maxRetries) throw e; }
  }
}
function banniere(msg) { const b = document.getElementById('banniere'); if (!msg) { b.style.display = 'none'; return; } b.textContent = '⏳ ' + msg; b.style.display = 'block'; }

// ── État ──────────────────────────────────────────────────────────────────────
let jourCourant = null, fichesCourantes = [], ficheIdx = 0, horsLigne = false, majTxt = '';

function jourParDefaut() {
  const q = new URLSearchParams(location.search).get('jour');
  if (q && JOURS.some(j => j.id === q.toUpperCase())) return q.toUpperCase();
  const auj = new Date(); const iso = auj.getFullYear() + '-' + String(auj.getMonth() + 1).padStart(2, '0') + '-' + String(auj.getDate()).padStart(2, '0');
  const j = JOURS.find(x => x.iso === iso);
  return j ? j.id : 'J2';
}

function dessinerJours() {
  document.getElementById('jours').innerHTML = JOURS.map(j =>
    `<button class="jour-btn ${j.id === jourCourant ? 'active' : ''}" onclick="choisirJour('${j.id}')">${j.label}<small>${j.court}</small></button>`).join('');
}

// ── Lecture des fiches du jour (avec copie locale pour les zones sans réseau) ─
async function chargerJour(jour, ouvrirAuto) {
  const err = document.getElementById('err'); err.textContent = '';
  const zone = document.getElementById('fiches');
  zone.innerHTML = `<div class="vide">⏳ Chargement…</div>`;
  horsLigne = false;
  let fiches = null;
  try {
    const json = await callASRetry({ action: 'getVerif', jour });
    if (!json.ok) throw new Error(json.error || 'Erreur inconnue');
    fiches = json.data || [];
    const hh = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    majTxt = 'Mis à jour à ' + hh;
    try { localStorage.setItem('ra2026_verif_cache_' + jour, JSON.stringify({ fiches, hh })); } catch(e) {}
  } catch (e) {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem('ra2026_verif_cache_' + jour) || 'null'); } catch(_) {}
    if (cache && cache.fiches) { fiches = cache.fiches; horsLigne = true; majTxt = '⚠ HORS LIGNE — dernière version reçue à ' + cache.hh; }
    else { zone.innerHTML = ''; err.textContent = e.message.includes('Timeout') ? 'Réseau trop lent — réessayez' : 'Erreur : ' + e.message; return; }
  }
  fichesCourantes = fiches.filter(f => f.verificateur || (f.lignes && f.lignes.length));
  if (!fichesCourantes.length) {
    zone.innerHTML = `<div class="vide">Aucune fiche Vérificateur enregistrée pour ${jour}.<br><br><button class="btn" onclick="chargerJour('${jour}')">↻ Actualiser</button></div>`;
    return;
  }
  const demande = parseInt(new URLSearchParams(location.search).get('fiche'), 10);
  if (ouvrirAuto && (fichesCourantes.length === 1 || demande)) { ouvrirFiche(Math.min(Math.max((demande || 1) - 1, 0), fichesCourantes.length - 1)); return; }
  zone.innerHTML = (horsLigne ? `<div class="maj horsligne">${esc(majTxt)}</div>` : '') +
    fichesCourantes.map((f, i) => `<button class="carte-fiche" onclick="ouvrirFiche(${i})">
      <b>${esc(f.verificateur || 'Fiche ' + (i + 1))}</b>
      <span>Fiche ${i + 1} · ${(f.lignes || []).length} PS${f.hmepSect ? ' · MeP ' + esc(f.hmepSect) : ''}</span></button>`).join('');
}

function choisirJour(j) { jourCourant = j; dessinerJours(); chargerJour(j, false); }
function actualiser() { const i = ficheIdx; chargerJour(jourCourant, false).then(() => { if (fichesCourantes[i]) ouvrirFiche(i); else retour(); }); }
function retour() { document.getElementById('screenFiche').style.display = 'none'; document.getElementById('screenChoix').style.display = 'block'; window.scrollTo(0, 0); }

// ── Affichage de la fiche ─────────────────────────────────────────────────────
function psParts(label) {
  const seg = String(label || '').split(' - ').map(x => x.trim()).filter(Boolean), nums = [];
  while (seg.length && /^\d+(\s*(&|,|et|a|à|bis|\d+))*$/i.test(seg[0])) nums.push(seg.shift());
  if (!nums.length) return { num: seg.shift() || '', rest: seg.join(' - ') };
  return { num: nums.join(' - '), rest: seg.join(' - ') };
}
function telLien(t) { return String(t || '').replace(/[^\d+]/g, ''); }

function ouvrirFiche(i) {
  ficheIdx = i;
  const f = fichesCourantes[i]; if (!f) return;
  const jour = JOURS.find(j => j.id === jourCourant);
  const radios = [f.com ? f.com + ' COM' : '', f.crs ? f.crs + ' CRS' : '', f.cmv ? f.cmv + ' CMV' : ''].filter(Boolean)
    .map(r => `<span class="pill">${r}</span>`).join('') || '<b>—</b>';
  const lignes = (f.lignes || []).map(l => {
    const p = psParts(l.ps);
    return `<div class="ps">
      <div class="num ${p.num.length > 7 ? 'long' : ''}">${esc(p.num)}</div>
      <div class="lieu">${esc(p.rest)}</div>
      <div class="droite">${l.type ? `<span class="rs ${l.type}">${l.type}</span>` : ''}<span class="heure">${esc(l.hmep)}</span></div>
      ${l.comm ? `<div class="com">${esc(l.comm)}</div>` : ''}
    </div>`;
  }).join('');
  const libres = [f.comm1, f.comm2].filter(Boolean);
  document.getElementById('ficheBody').innerHTML = `
    <div class="entete">
      <div class="jour">${jour.date} (${jour.id})${fichesCourantes.length > 1 ? ' · Fiche ' + (i + 1) + '/' + fichesCourantes.length : ''}</div>
      <div class="nom">${esc(f.verificateur || '—')}</div>
      ${f.tel ? `<a class="appel" href="tel:${telLien(f.tel)}">📞 ${esc(f.tel)}</a>` : ''}
      <div class="infos">
        <div class="info"><small>H MeP secteur</small><b>${esc(f.hmepSect) || '—'}</b></div>
        <div class="info"><small>Véhicule</small><b>${esc(f.vehicule) || '—'}</b></div>
        <div class="info large"><small>Radios</small>${radios}</div>
      </div>
    </div>
    <div class="liste">${lignes || '<div class="vide">Aucun PS sur cette fiche</div>'}</div>
    <div class="legende"><b>R</b> = Rubalise &nbsp;·&nbsp; <b>S</b> = Signaleur</div>
    ${libres.length ? `<div class="libre"><small>Commentaire</small>${libres.map(esc).join('<br>')}</div>` : ''}
    <div class="urgence">🚨 En cas d'accident : PC ROC sur RADIO COURSE</div>
    <div class="maj ${horsLigne ? 'horsligne' : ''}">${esc(majTxt)}</div>`;
  document.getElementById('screenChoix').style.display = 'none';
  document.getElementById('screenFiche').style.display = 'block';
  window.scrollTo(0, 0);
}

// ── Démarrage (après validation du code d'accès) ──────────────────────────────
function demarrer() {
  jourCourant = jourParDefaut();
  dessinerJours();
  chargerJour(jourCourant, true);
}
(function () {
  var ok = false; try { ok = sessionStorage.getItem('pinOk') === '1'; } catch (e) {}
  if (ok) demarrer(); else window.addEventListener('pin-ok', demarrer, { once: true });
})();
</script>
</body>
</html>
